# Lint + tests on every push to main or dev, and every pull request.
#
# `dev` is in that list because it is the integration branch -- feature work
# lands there, not on main, so without it a merge to dev runs nothing and the
# first CI a change sees is the release tag.
#
# Note for anyone editing this: install the project with `pip install -e .[dev]`,
# never `-r requirements.txt`. That file is a UTF-16 `pip freeze` snapshot taken
# on Windows and it does not install on Linux.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  # A new push to the same branch makes the in-flight run obsolete.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Ruff alone, not the project: this job needs no OpenCV, and skipping the
      # install turns a two-minute job into a ten-second one. Pinned so a new
      # ruff release cannot turn a green branch red on its own schedule — bump
      # it deliberately, together with the version in pyproject.toml's dev extra.
      - run: pip install ruff==0.16.2
      - run: ruff check --output-format=github .

  # The updater, on its own and ahead of the matrix. It is the one feature no
  # installed copy can be told to work around: a broken update check is a laptop
  # that quietly stays on an old version until someone notices at a venue, and
  # the contract it rests on is spread across comp1/update.py, build.ps1,
  # installer/comp1.iss and release.yml -- files that otherwise only ever meet
  # during a real tagged build.
  #
  # These two files reach nothing heavier than the standard library, so the job
  # needs pytest and PYTHONPATH rather than `pip install -e .[dev]` and OpenCV.
  # That buys a ~20-second gate that names the updater when it goes red, instead
  # of a failure buried in 500-odd tests ten minutes later. The full matrix below
  # runs these same files again, along with tests/test_update_flow.py, which does
  # need the server.
  update:
    name: updater contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - name: Update check, download, handover, and the release contract
        env:
          PYTHONPATH: .
        run: pytest tests/test_update.py tests/test_update_release.py -q

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 only: it is what the installer is built and shipped on, so a
        # second cell would be testing an interpreter nobody runs. Widen this
        # again only together with release.yml -- a version tested here but not
        # shipped, or shipped but not tested, is the gap this list exists to
        # close.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `import cv2` needs these on the bare runner image, and almost the whole
      # suite reaches OpenCV through comp1/vision, comp1/sim or the server.
      - name: Install OpenCV's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -e .[dev]
      - run: pytest -q

  js-test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # blocks.test.js duck-types Blockly and needs nothing, but buffer.test.js
      # and calibration.test.js need jsdom, so the install is not optional.
      - run: npm ci
      # A glob, not the directory. `node --test tests/js` does not scan a
      # directory -- node resolves the positional argument as a module, finds no
      # tests/js/index.js and dies with MODULE_NOT_FOUND, which the runner then
      # reports as one failing test called "tests/js". Quoted so node expands
      # the pattern itself rather than the shell, which keeps the command
      # identical on every platform.
      - run: node --test 'tests/js/**/*.test.js'
