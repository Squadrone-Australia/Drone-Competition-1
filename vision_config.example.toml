# Vision tuning for the red fire marker detector.
#
# Copy this file (e.g. to vision_config.toml) and pass it with
#   comp1 --vision-config vision_config.toml
# The values below are the code defaults from comp1/vision/config.py — edit
# whichever ones you need for on-site conditions and delete the rest; keys
# left out of the file simply keep the code default.

# --- colour: red wraps the hue axis, so two HSV bands are ORed together (requirements §3.1) ---
# The saturation and value floors are set low enough to reach a marker sitting in
# a shadowed corner. Raise them if something red in the room is being picked up;
# lower them further only if markers go missing in dim light, and re-run the
# scenery false-positive tests afterwards.
lower1 = [0, 70, 50]
upper1 = [12, 255, 255]
lower2 = [165, 70, 50]
upper2 = [180, 255, 255]

# --- shape gates ---
min_area_ratio = 0.002     # ignore specks; also caps detection range (see max_detect_range_m)
max_area_ratio = 0.35      # a blob bigger than this is too close to be the marker --
                           # rejects large red objects outside the cage, which would
                           # otherwise read as very near and win the nearest-first sort.
                           # Must stay above the marker's size at approach_stop_distance_m
                           # (~0.13 at the defaults) or arriving blinds the detector.
circularity_min = 0.82     # 4*pi*Area/Perimeter^2 of the convex hull -- square ~ 0.785,
                           # clean circle ~ 0.99. Measured on the hull, not the raw
                           # contour, so a shadow notch or a ragged compressed edge
                           # no longer collapses it.
solidity_min = 0.85        # contour area / hull area -- disc ~ 1.0, five-point star ~ 0.54.
                           # This is what rejects non-convex red shapes, since the hull
                           # itself smooths them into something near-circular.
center_band = 0.2          # |cx - 0.5| < band/2 counts as "centered"

# --- physical geometry: what turns pixels into metres ---
marker_diameter_m = 0.25   # printed fire marker, A4-ish
# camera_dfov_deg = 82.6   # uncomment to override the Tello's diagonal FOV (see calibrate.py)

# --- approach control, in real units (requirements §3.2) ---
approach_stop_distance_m = 1.0
approach_bearing_deadband_deg = 8.0
# the Tello ignores rotations below ~10 deg and refuses translations below 20 cm,
# so these floors are hardware limits, not tuning preferences
approach_min_turn_deg = 10
approach_max_turn_deg = 45
approach_min_step_cm = 20
approach_max_step_cm = 100
approach_max_steps = 40
# How long the marker may stay out of view before the approach gives up, in
# seconds. Raise it in a cluttered or badly lit arena, where the detector drops
# frames in bursts; lower it if the drone hovers too long over a marker that has
# genuinely gone.
approach_lost_timeout_s = 2.5

# --- multi-target locking ---
# once locked, prefer the candidate nearest the last known bearing rather than
# whichever happens to be biggest this frame; stops the drone ping-ponging
# between two similarly sized red circles
lock_max_bearing_jump_deg = 25.0
lock_lost_frames = 5

# --- obstacles: everything that is NOT an accepted red circle ---
# Obstacle detection is defined negatively. It finds every colourful blob in the
# frame and removes the ones the marker detector accepted; whatever is left is
# something to stay away from. There is no list of obstacle shapes or colours,
# and there must not be — a shape nobody anticipated still has to be avoided.
#
# These drive a SECOND mask, separate from the red bands above. Re-tuning the red
# bands does not affect them and vice versa.

# The obstacle mask thresholds on saturation and value only, never hue: one mask
# has to catch a red square, a green triangle, a blue circle and a yellow square,
# and the only thing they share is being colourful.
#
# ** This is the key on-site tuning knob. ** What keeps the room out of the mask
# is that walls and floor are washed-out and cool-toned. A warm-lit wall, a
# painted line, a sponsor banner or a bright floor mat can all clear this floor
# and be reported as an obstacle. Raise obstacle_sat_min until the arena reads
# clear with nothing in front of the drone; if you have to raise it past ~120 the
# obstacles themselves start dropping out, and the room needs re-lighting rather
# than more tuning.
obstacle_sat_min = 80
obstacle_val_min = 50

# Smallest blob that counts. Higher than min_area_ratio on purpose: an obstacle
# only matters close in, and a tighter floor keeps distant clutter out of the
# student's way. 0.004 gives roughly 2.8 m of range at the default printed size.
obstacle_min_area_ratio = 0.004
# Deliberately generous — unlike a marker, an obstacle really can fill the view.
# This only rejects a frame-wide colour wash.
obstacle_max_area_ratio = 0.9

# Range is derived from apparent size, so it needs an assumed printed size. Set
# this to whatever the obstacles are actually printed at. An obstacle printed
# LARGER than this reads as nearer than it is, which errs in the safe direction;
# one printed smaller reads as further away, which does not — so if the arena
# mixes sizes, set this to the SMALLEST of them.
obstacle_diameter_m = 0.25

# Closer than this, and centred in the view, is what the "obstacle in the way?"
# block reports and what "step around obstacle" acts on. Raise it to make the
# drone commit to going around earlier.
obstacle_clear_distance_m = 1.0

# --- obstacle avoidance ---
# One sideways step, repeated until the way ahead is clear. Must stay at or above
# the Tello's 20 cm translation floor or the aircraft silently ignores the move.
avoid_sidestep_cm = 60
avoid_max_steps = 6
