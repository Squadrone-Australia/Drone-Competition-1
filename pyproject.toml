[project]
name = "comp1"
# Read from comp1/__init__.py so the package, the packaged exe and the
# installer can never disagree about what version this is.
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.51",
    "pydantic>=2.13",
    "djitellopy>=2.5",
    "opencv-python>=5.0",
    "numpy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "httpx>=0.28", "pyinstaller>=6.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "comp1.__version__"}

[tool.setuptools.packages.find]
include = ["comp1*"]
