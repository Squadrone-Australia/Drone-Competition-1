[project]
name = "comp1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.51",
    "pydantic>=2.13",
    "djitellopy>=2.5",
    "opencv-python>=5.0",
    "numpy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "httpx>=0.28", "pyinstaller>=6.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["comp1*"]
