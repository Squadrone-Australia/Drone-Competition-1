[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comp1"
# Read from comp1/__init__.py so the package, the packaged exe and the
# installer can never disagree about what version this is.
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.51",
    "pydantic>=2.13",
    "djitellopy>=2.5",
    "opencv-python>=5.0",
    "numpy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "httpx>=0.28", "pyinstaller>=6.21", "ruff>=0.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# The code is written to roughly a 100-column budget; ruff's default 88 would
# flag dozens of lines that are fine as they are.
line-length = 100
extend-exclude = ["comp1/frontend/vendor", "node_modules", ".conda", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.setuptools.dynamic]
version = {attr = "comp1.__version__"}

[tool.setuptools.packages.find]
include = ["comp1*"]
