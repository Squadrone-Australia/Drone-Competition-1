# Flight tuning for the real Tello. Hardware quirks, not vision — HSV and marker
# geometry live in vision_config.example.toml and its own --vision-config flag.
#
# Copy this file (e.g. to flight_config.toml) and pass it with
#   comp1 --drone tello --flight-config flight_config.toml
# The values below are the code defaults from comp1/drone/config.py — edit
# whichever ones you need for on-site conditions and delete the rest; keys
# left out of the file simply keep the code default.

# --- flip recovery ---
# A Tello does not flip on the spot: it throws itself along the flip direction
# and stays there, so a "signal fire found" back-flip leaves the drone short
# of where it made the find and every following move starts from the wrong
# place. Measure the displacement on the arena floor and put it here; the
# adapter flies the same distance the opposite way once the flip completes.
#
# 30 is a reasonable starting point. Battery level and floor surface both move
# it, so re-measure on the day. The Tello refuses translations below 20 cm, so
# anything under that (including 0) skips the recovery move entirely.
flip_recover_cm = 30

# --- link watchdog ---
# How long the video stream may be silent before the adapter calls the link
# dead and the server reconnects by itself. This is what makes a Tello that
# was rebooted (or that dropped its Wi-Fi) come back without restarting the
# program: a lost aircraft does not report an error, it simply stops sending
# frames, and the decoder keeps handing back the last one it got forever.
#
# Raise it if a congested hall makes the stream stutter for seconds at a time
# and you see needless reconnects; lower it to notice a lost drone sooner.
link_timeout_s = 6.0

# --- find-signal battery floor ---
# Below roughly 50% charge a Tello refuses `flip` outright. It answers with an
# error and keeps hovering, so the find signal the judges are watching for
# (requirements §2.1) is the one thing that silently does not happen while the
# program counts the find and flies on. "signal target found" therefore reads
# the battery first and turns a doomed flip into a 360-degree spin, which the
# aircraft will always do.
#
# This is the charge it switches over at, in percent. The margin above 50
# covers the level sagging between the reading and the manoeuvre — raise it if
# a tired battery still refuses flips near the line. 0 disables the fallback
# and always flips, which is only sensible on a bench with a full pack.
flip_min_battery_pct = 55
